title: "GLAB-VOD"
description: >
  GLAB-VOD is a global L-band vegetation optical depth dataset with 18-day temporal and 25 km spatial resolution, covering 2002 to 2020. A neural network reproduces the SMOS-SMAP-INRAE-BORDEAUX (SMOSMAP-IB) VOD product (2015 to 2020) from brightness temperatures of the SMOS, AMSR-E and AMSR-2 missions and the CASM soil moisture dataset. A side product, GLAB TB, is a daily 25 km brightness temperature dataset that matches SMOS quality back to 2002.

